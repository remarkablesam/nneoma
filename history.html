<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebonyi Farm Market - Order History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                            950: '#052e16',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body class="ebonyi-farm-market-page-bg text-slate-800 font-sans transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 max-w-sm pointer-events-none"></div>

    <div class="border-b border-slate-100 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <button type="button" onclick="closeBasketHistory()" class="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-slate-900 dark:hover:text-white transition" aria-label="Back to store">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="min-w-0">
                    <p class="text-xs font-bold uppercase tracking-[0.2em] text-brand-600">Order History</p>
                    <h1 class="text-xl sm:text-2xl font-black truncate">Grouped purchase cards</h1>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="toggleDarkMode()" class="p-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:border-brand-500 hover:text-brand-600 transition" aria-label="Toggle theme">
                    <i data-lucide="sun" id="theme-icon-light" class="w-5 h-5 hidden"></i>
                    <i data-lucide="moon" id="theme-icon-dark" class="w-5 h-5 hidden"></i>
                </button>
                <button type="button" onclick="clearBasketHistory()" class="inline-flex items-center gap-2 rounded-xl bg-slate-900 dark:bg-slate-800 px-3 py-2 text-xs sm:text-sm font-bold text-white hover:bg-red-600 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span>Clear My History</span>
                </button>
            </div>
        </div>
    </div>

    <main id="basket-history-page" class="flex-1 overflow-y-auto">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            <div class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 sm:p-6 shadow-sm mb-5">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-brand-600">Recent purchases</p>
                <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
                    Each order is shown as its own card, with unavailable items labeled clearly so they stand out.
                </p>
            </div>
            <div id="basket-history-summary" class="mb-5 grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
            <div id="basket-history-list" class="space-y-3"></div>
        </div>
    </main>

    <script src="./assets/js/app.js?v=20260927crops3"></script>
</body>
</html>
